<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mark Mileage">
<meta name="theme-color" content="#111827">
<title>Mark Mileage</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827}
header{background:#111827;color:white;padding:20px 16px 16px}h1{margin:0;font-size:26px}header p{margin:4px 0 0;opacity:.75}
main{max-width:720px;margin:auto;padding:14px 12px 90px}.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0001}
h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;font-weight:700;display:block;margin:10px 0 5px}
input,textarea{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
button{appearance:none;-webkit-appearance:none;border:0;border-radius:11px;padding:14px;font-size:16px;font-weight:700;width:100%;background:#111827;color:#fff}
button:active{transform:scale(.98);opacity:.85}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.job{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:10px}
.jobhead{display:flex;justify-content:space-between;gap:8px}.km{font-weight:800;white-space:nowrap}
.meta{font-size:13px;color:#6b7280;margin-top:4px}.status{margin-top:10px;padding:10px;border-radius:10px;background:#f3f4f6;font-size:14px}
.empty{text-align:center;color:#6b7280;padding:20px}.hidden{display:none!important}
@media(max-width:480px){.grid,.btnrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Mark Mileage</h1><p>70-line mileage claim • General Plumbing</p></header>
<main>
<section class="card">
<h2>➕ Add Job</h2>
<div class="grid">
<div><label>Date</label><input id="date" type="date"></div>
<div><label>KM</label><input id="km" type="number" min="0" step="0.1" placeholder="Enter round-trip KM"></div>
</div>
<label>Job address</label>
<input id="address" autocomplete="street-address" placeholder="Enter job address">
<label>Reason for travel</label>
<input value="General Plumbing" readonly>
<button id="addBtn" type="button">ADD JOB</button>
<div id="status" class="status hidden"></div>
</section>

<section class="card">
<h2>📋 Jobs <span id="count">(0)</span></h2>
<div id="jobs"><div class="empty">No jobs yet.</div></div>
<div class="btnrow">
<button id="wordBtn" class="secondary" type="button">📄 MAKE CLAIM</button>
<button id="csvBtn" class="secondary" type="button">⬇️ CSV</button>
</div>
<button id="clearBtn" class="danger" style="margin-top:10px" type="button">CLEAR ALL JOBS</button>
</section>

<section class="card">
<h2>📷 Diary Photo</h2>
<p style="color:#6b7280;font-size:14px">This version keeps photo capture separate so it cannot break the Add Job button.</p>
<input id="photo" type="file" accept="image/*" capture="environment">
<div id="photoStatus" class="status hidden"></div>
</section>

<section class="card">
<h2>⚙️ App status</h2>
<p id="appStatus" style="font-size:14px;margin:0">Ready.</p>
</section>
</main>

<script>
(function(){
"use strict";
const KEY="MARK_MILEAGE_V2_JOBS";
let jobs=[];
try{jobs=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(jobs))jobs=[]}catch(e){jobs=[]}

const $=id=>document.getElementById(id);
function today(){return new Date().toISOString().slice(0,10)}
$("date").value=today();

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(jobs));}
  catch(e){showStatus("Storage error: "+e.message)}
}
function showStatus(msg){
  $("status").textContent=msg;$("status").classList.remove("hidden");
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function render(){
  $("count").textContent="("+jobs.length+")";
  if(!jobs.length){$("jobs").innerHTML='<div class="empty">No jobs yet.</div>';return}
  $("jobs").innerHTML=jobs.map((j,i)=>`
    <div class="job">
      <div class="jobhead"><strong>${esc(j.address)}</strong><span class="km">${Number(j.km).toFixed(1)} km</span></div>
      <div class="meta">${esc(j.date)} • NCOD → job → NCOD</div>
      <div class="meta">Reason: General Plumbing</div>
      <button class="danger" type="button" data-remove="${i}" style="margin-top:9px;padding:9px;font-size:13px">REMOVE</button>
    </div>`).join("");
  document.querySelectorAll("[data-remove]").forEach(b=>b.addEventListener("click",function(){
    jobs.splice(Number(this.dataset.remove),1);save();render();
  }));
}

$("addBtn").addEventListener("click",function(){
  const address=$("address").value.trim();
  const km=Number($("km").value);
  const date=$("date").value||today();
  if(!address){showStatus("❗ Enter the job address first.");$("address").focus();return}
  if(!Number.isFinite(km)||km<=0){showStatus("❗ Enter the round-trip KM.");$("km").focus();return}
  jobs.push({date,address,km:Math.round(km*10)/10,eircode:"",reason:"General Plumbing",from:"NCOD"});
  save();render();
  $("address").value="";$("km").value="";
  showStatus("✅ Job added successfully.");
  $("address").focus();
});

$("clearBtn").addEventListener("click",function(){
  if(!jobs.length){showStatus("There are no jobs to clear.");return}
  if(window.confirm("Clear all saved jobs?")){jobs=[];save();render();showStatus("All jobs cleared.")}
});

function download(name,type,text){
  const blob=new Blob([text],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

$("csvBtn").addEventListener("click",function(){
  if(!jobs.length){showStatus("Add at least one job first.");return}
  let out="Date,From,Job Address,Eircode,Reason for Travel,KM\\n";
  out+=jobs.map(j=>[j.date,"NCOD",j.address,j.eircode,"General Plumbing",j.km].map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\\n");
  download("Mark_Mileage.csv","text/csv;charset=utf-8",out);
  showStatus("✅ CSV created.");
});

$("wordBtn").addEventListener("click",function(){
  if(!jobs.length){showStatus("Add at least one job first.");return}
  let rows="";
  for(let i=0;i<70;i++){
    const j=jobs[i];
    rows+=`<tr><td>${i+1}</td><td>${j?esc(j.date):""}</td><td>${j?"NCOD":""}</td><td>${j?esc(j.address):""}</td><td>${j?esc(j.eircode):""}</td><td>${j?"General Plumbing":""}</td><td>${j?Number(j.km).toFixed(1):""}</td></tr>`;
  }
  const doc=`<html><head><meta charset="utf-8"><style>body{font-family:Arial;font-size:9pt}h2{text-align:center}table{border-collapse:collapse;width:100%}th,td{border:1px solid #000;padding:4px}th{background:#eee}</style></head><body><h2>Mark Regan Mileage Claim</h2><p><b>Starting / ending point:</b> NCOD</p><table><tr><th>No.</th><th>Date</th><th>From</th><th>Job / To</th><th>Eircode</th><th>Reason for Travel</th><th>KM</th></tr>${rows}</table></body></html>`;
  download("Mark_Regan_Mileage_Claim.doc","application/msword",doc);
  showStatus("✅ 70-line claim created.");
});

$("photo").addEventListener("change",function(){
  if(this.files&&this.files[0]){
    $("photoStatus").textContent="✅ Photo selected: "+this.files[0].name+". Photo capture is working; automatic handwriting recognition will be added next.";
    $("photoStatus").classList.remove("hidden");
  }
});

$("appStatus").textContent="Ready — buttons use direct click handlers and do not depend on internet routing.";
render();
})();
</script>
</body>
</html>
